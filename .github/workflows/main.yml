name: Unit Tests

on:
  push:
    branches:
      - main
      - feature

  pull_request:
    branches:
      - main
      - feature

jobs:
  unit-test:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone LVGL
        run: |
          git clone --depth 1 https://github.com/lvgl/lvgl.git thirdparty/lvgl

      - name: Verify LVGL files
        run: |
          pwd
          ls -l thirdparty/lvgl
          ls -l thirdparty/lvgl/src
          ls -l thirdparty/lvgl/src/others
          ls -l thirdparty/lvgl/src/others/test

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            cmake \
            ninja-build \
            build-essential \
            lcov

      - name: Configure CMake
        run: |
          cmake \
            -S tests \
            -B tests/build \
            -DENABLE_COVERAGE=ON

      - name: Show compile command
        run: |
          cat tests/build/compile_commands.json | grep test_ViewController.cpp

      - name: Build Tests
        run: |
          cmake --build tests/build

      - name: Run Google Tests
        run: |
          ./tests/build/PatientMonitorTests